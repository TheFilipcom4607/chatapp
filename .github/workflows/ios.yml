name: iOS build

on:
  push:
    branches: [main, "c/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Halo.xcodeproj/project.pbxproj') }}

      - name: Build app + tests (simulator)
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Halo.xcodeproj -scheme Halo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              tail -30 build.log
              echo "=====ERRORS====="
              grep -E "error:|fatal error" build.log | sort -u | head -150
              exit 1
            }
          grep -E "warning:" build.log | grep -v "SourcePackages" | sort -u | head -60 || true
          echo "BUILD OK"

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcodebuild test-without-building \
            -project Halo.xcodeproj -scheme Halo \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || {
              # CoreData logs thousands of "error" lines in the simulator; leave them out.
              grep -v "CoreData" test.log | grep -E "error: -\[|: error:|Test Case .* failed|Fatal error|crashed|Restarting after|Testing failed|\*\* TEST" | head -100 || true
              echo "=====TAIL====="
              grep -v "CoreData" test.log | tail -40 || true
              exit 1
            }
          grep -E "Executed|passed|Test Suite" test.log | tail -10

      - name: Screenshots (demo mode)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find build/Build/Products -name "Halo.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p shots
          for s in home chat sidebar approval artifact spend onboarding settings models modeldetail persona details sources sourcelist; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demo -demoScreen $s > /dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$s.png" > /dev/null 2>&1
          done
          for s in shots/*.png; do
            sips -Z 1100 -s format jpeg -s formatOptions 70 "$s" --out "${s%.png}.jpg" > /dev/null
          done
          ls -la shots

      - name: Publish screenshots to ci-shots tag
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        run: |
          D=$(mktemp -d)
          cp shots/*.jpg "$D/"
          cd "$D"
          git init -q
          git config user.name "halo-ci"
          git config user.email "ci@halo.invalid"
          git add .
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/tags/ci-shots

      - name: Upload screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[shots]') || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
