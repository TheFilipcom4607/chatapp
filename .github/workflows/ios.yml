name: iOS build

on:
  push:
    branches: [main, "c/**"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('Halo.xcodeproj/project.pbxproj') }}

      - name: Build app + tests (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Halo.xcodeproj -scheme Halo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
              echo "::group::Errors"
              grep -E "error:|fatal error" build.log | sort -u | head -150
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -E "warning:" build.log | grep -v "SourcePackages" | sort -u | head -60 || true
          echo "BUILD OK"

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator: $UDID"
          xcodebuild test-without-building \
            -project Halo.xcodeproj -scheme Halo \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || {
              grep -E "error|failed|Fail" test.log | head -100
              tail -40 test.log
              exit 1
            }
          grep -E "Executed|passed|Test Suite" test.log | tail -10

      - name: Screenshots (demo mode)
        if: contains(github.event.head_commit.message, '[shots]')
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find build/Build/Products -name "Halo.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for s in home chat sidebar approval artifact spend; do
            xcrun simctl terminate "$UDID" com.filip.halo 2>/dev/null || true
            xcrun simctl launch "$UDID" com.filip.halo -demo -demoScreen $s > /dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$s.png" > /dev/null 2>&1
          done
          for s in shots/*.png; do
            sips -Z 760 -s format jpeg -s formatOptions 50 "$s" --out "${s%.png}.jpg" > /dev/null
            echo "=====BEGIN $(basename ${s%.png})====="
            base64 -i "${s%.png}.jpg" | fold -w 2000
            echo "=====END====="
          done

      - name: Upload screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
